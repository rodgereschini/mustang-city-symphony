<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Irving Recitals</title>

  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --accent: #d2bb97;
      --text: #1d1d1b;
      --muted: #716b63;
      --paper: #fffdf9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--text);
      font-family: "Old Standard TT", serif;
      font-weight: 400;
    }

    .top-bar {
      height: 12px;
      width: 100%;
      background: var(--accent);
    }

    .page {
      min-height: calc(100vh - 12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    .content {
      width: min(100%, 780px);
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 22px;

      color: var(--muted);

      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: clamp(3rem, 9vw, 6.3rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.025em;
    }

    .rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;

      width: min(100%, 380px);
      margin: 34px auto 30px;
    }

    .rule::before,
    .rule::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--accent);
    }

    .diamond {
      width: 9px;
      height: 9px;
      background: var(--accent);
      transform: rotate(45deg);
    }

    .season {
      margin: 0 0 18px;

      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .location {
      margin: 0;

      color: var(--muted);

      font-size: 1.05rem;
      line-height: 1.6;
    }

    .forthcoming {
      margin-top: 70px;

      color: var(--muted);

      font-size: 0.9rem;
      font-style: italic;
    }

    .bottom-rule {
      width: 52px;
      height: 3px;

      margin: 28px auto 0;

      background: var(--accent);
    }

    @media (max-width: 600px) {
      .page {
        padding: 46px 20px;
      }

      .eyebrow {
        margin-bottom: 18px;
        font-size: 0.72rem;
      }

      h1 {
        font-size: clamp(3rem, 16vw, 4.5rem);
      }

      .rule {
        margin-top: 28px;
        margin-bottom: 26px;
      }

      .season {
        font-size: 1.05rem;
      }

      .location {
        font-size: 0.98rem;
      }

      .forthcoming {
        margin-top: 55px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar"></div>

  <main class="page">

    <div class="content">

      <div class="eyebrow">
        Irving, Texas
      </div>

      <h1>
        The Irving<br>
        Recitals
      </h1>

      <div class="rule" aria-hidden="true">
        <span class="diamond"></span>
      </div>

      <p class="season">
        2026–2027 Season
      </p>

      <p class="location">
        A series of intimate musical performances<br>
        in Irving, Texas.
      </p>

      <div class="forthcoming">
        Brought to you by the Irving Catholic Community.
      </div>

      <div class="bottom-rule" aria-hidden="true"></div>

    </div>

  </main>

</body>
</html>
